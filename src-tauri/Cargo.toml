[package]
name = "linchuan"
version = "0.1.0"
edition = "2021"

[lib]
name = "linchuan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
linchuan-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
