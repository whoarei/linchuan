[package]
name = "linchuan"
version = "0.7.2"
edition = "2021"

[lib]
name = "linchuan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
linchuan-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
enigo = "0.6.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2.8.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-sdp = "0.24"
gstreamer-webrtc = { version = "0.24", features = ["v1_20"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
