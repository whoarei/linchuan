name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build and verify run ID for the exact tagged commit
        required: true
      tag:
        description: Existing version tag
        default: v0.3.0
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions Secret: $name"
              missing=1
            fi
          done
          test "$missing" = 0
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.build_run }}
        run: |
          test "$(gh run view "$RUN" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN" --json headSha --jq .headSha)" = "$(git rev-parse HEAD)"
          test "$(gh run view "$RUN" --json workflowName --jq .workflowName)" = 'Build and verify'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          pattern: '*-x64'
          path: artifacts
          merge-multiple: true
      - name: Decode Android signing key
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/linchuan-release.keystore"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: android-arm64-unsigned
          path: android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install cryptography
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Collect desktop installers
        run: python3 scripts/collect-release.py artifacts release
      - name: Sign and verify Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'linchuan' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ inputs.tag }}
        run: |
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          mapfile -d '' apks < <(find android -type f -name '*.apk' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one Android release APK'
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          output="release/Linchuan_${TAG#v}_android_arm64.apk"
          "$build_tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/linchuan-aligned.apk"
          "$build_tools/apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/linchuan-release.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$output" "$RUNNER_TEMP/linchuan-aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$output"
          "$build_tools/zipalign" -c -P 16 4 "$output"
      - name: Sign desktop updates and generate checksums
        env:
          TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python3 scripts/updates.py sign release --tag "$TAG"
          python3 scripts/checksums.py release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release/* --verify-tag --draft --title "邻传 $TAG" --notes-file "docs/releases/${TAG#v}.md"
          gh release edit "$TAG" --draft=false --latest
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/linchuan-release.keystore" "$RUNNER_TEMP/linchuan-aligned.apk"
